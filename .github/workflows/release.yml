name: Release to GitHub

on:
  push:
    tags:
      - 'v*'
      - 'v*-*'  # Captures v2.0.0-beta.2, v2.0.0-rc.1, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Extract Version from Tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%B %d, %Y')" >> $GITHUB_OUTPUT
          IS_PRERELEASE=$(echo "$VERSION" | grep -E '(beta|rc|alpha|dev)' && echo 'true' || echo 'false')
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## 📦 ${{ steps.version.outputs.tag }}

            **Release Date:** ${{ steps.version.outputs.date }}

            **Status:** ${{ steps.version.outputs.is_prerelease == 'true' && '🟡 PRE-RELEASE (Beta/RC)' || '✅ STABLE' }}

            ### 📝 Changes
            ${{ steps.changelog.outputs.changelog }}

            ### 🔗 Links
            - **Full Changelog:** [CHANGELOG.md](./CHANGELOG.md)
            - **Release Notes:** [RELEASE_NOTES.md](./RELEASE_NOTES.md)
            - **Upgrade Guide:** [UPGRADE_GUIDE.md](./UPGRADE_GUIDE.md)

            ### ⚠️ Note
            ${{ steps.version.outputs.is_prerelease == 'true' && 'This is a pre-release build. Use in staging/testing environments only.' || 'This is a stable production release.' }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          draft: false
          files: |
            package.json
            CHANGELOG.md
            RELEASE_NOTES.md
            UPGRADE_GUIDE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Release Success
        run: |
          echo "✅ Release ${{ steps.version.outputs.tag }} created successfully!"
          echo "📋 Tag: ${{ steps.version.outputs.tag }}"
          echo "🟡 Pre-release: ${{ steps.version.outputs.is_prerelease }}"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"